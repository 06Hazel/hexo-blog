# ===============================================================
# Fluid 主题个性化配置
# 只写要覆盖的项，其余沿用主题默认值
# 文档：https://hexo.fluid-dev.com/docs/
# ===============================================================

# 暗色模式：默认进入暗色，访客也能手动切换
dark_mode:
  enable: true
  default: dark

# 顶部导航
navbar:
  blog_title: "莹莹垂看假梦真"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# 搜索
search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

# 首页
index:
  banner_img: /img/default.png
  banner_img_height: 82
  banner_mask_alpha: 0.4
  slogan:
    enable: true
    # 首页大标题（改这里就能换掉横幅上的字）
    text: "莹莹垂看假梦真"
  # 首页文章卡片下面只显示日期，不显示分类和标签
  post_meta:
    date: true
    category: false
    tag: false

# 文章页
post:
  banner_img: /img/default.png
  banner_img_height: 60
  banner_mask_alpha: 0.4
  # 打开留言区，用 Waline
  comments:
    enable: true
    type: waline
  meta:
    date:
      enable: true
      format: "LL"
    wordcount:
      enable: true
    min2read:
      enable: true

# 归档页
archive:
  banner_img: /img/default.png
  banner_img_height: 50
  banner_mask_alpha: 0.4

# 关于页：头像和简介在这里改
about:
  enable: true
  banner_img: /img/default.png
  banner_img_height: 50
  banner_mask_alpha: 0.4
  avatar: '/images/avatar.jpg'
  name: "06Hazel"
  intro: "一个用 Hexo + Fluid 搭建的静态博客，托管在 GitHub Pages。"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/06Hazel", tip: "GitHub" }

# 自定义样式与脚本
custom_css:
  - /css/custom.css

custom_js:
  - /js/custom.js

# 留言区（Waline）
# 部署好 Waline 服务端后，把 serverURL 改成你的地址，留言框就会出现在每篇文章底部
waline:
  serverURL: 'https://liuyan-06hazel.vercel.app'
  path: window.location.pathname
  # 只要求填昵称，邮箱和网址都是选填 —— 这就是「可以匿名，也可以公开身份」
  meta: ['nick', 'mail', 'link']
  requiredMeta: ['nick']
  lang: 'zh-CN'
  emoji: ['https://cdn.jsdelivr.net/gh/walinejs/emojis/weibo']
  dark: 'html[data-user-color-scheme="dark"]'
  pageSize: 10
